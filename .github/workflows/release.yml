name: Release Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build renderer bundle
        run: node build.mjs

      - name: Build main-process bundle
        run: node build-main.mjs

      - name: Build runner bundle
        run: node build-runner.mjs

      - name: Generate manifest
        run: node generate-manifest.mjs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/manifest.json
            changelog.json
            dist/schema-drift-detector.js
            dist/schema-drift-detector-runner.js
